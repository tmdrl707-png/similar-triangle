<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>닮은 삼각형</title>
<style>
/* ── 리소 인쇄물 느낌: 크림 종이 + 검은 잉크 + 형광 핑크·블루, 굵은 테두리와 단단한 그림자 ── */
:root{
  --paper:#FBF5EA; --ink:#17171C; --dim:#6E6A62; --line:#17171C;
  --pink:#FF3E6C; --blue:#2F5BFF; --yel:#FFD84D; --mint:#00B37E; --soft:#F3EBDB;
  --o:#00B37E; --x:#FF3E6C;
  --sans:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --sh:4px 4px 0 var(--ink);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;word-break:keep-all}
body{background-image:radial-gradient(rgba(23,23,28,.07) 1px,transparent 1.2px);background-size:14px 14px}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
#app{max-width:560px;margin:0 auto;padding:12px 14px 120px;min-height:100vh}
.scr{display:none}.scr.on{display:block}

/* 첫 화면 */
.hero{padding:40px 4px 10px;position:relative}
.hero svg{width:150px;height:96px;display:block;margin-bottom:4px}
.hero h1{font-size:44px;line-height:1.05;margin:0 0 10px;font-weight:900;letter-spacing:-.05em}
.hero h1 span{background:var(--yel);padding:0 6px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.hero p{margin:0;color:var(--dim);font-size:16px}
.menu{display:grid;gap:14px;margin-top:26px}
.mbtn{display:flex;align-items:center;gap:14px;background:#fff;border:2.5px solid var(--ink);border-radius:6px;padding:14px 16px;text-align:left;box-shadow:var(--sh);transition:transform .08s,box-shadow .08s}
.mbtn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.mbtn .ic{min-width:52px;height:52px;padding:0 6px;border:2.5px solid var(--ink);border-radius:4px;display:grid;place-items:center;font-weight:900;font-size:17px;color:var(--ink);flex:0 0 auto;letter-spacing:-.03em}
.mbtn b{display:block;font-size:20px;font-weight:900;white-space:nowrap;letter-spacing:-.03em}
.mbtn small{color:var(--dim);font-size:14px}
.corner{position:fixed;z-index:5;top:10px;right:max(10px,calc(50% - 270px));background:none;border:none;color:var(--dim);font-size:13px;padding:6px;text-decoration:underline}

/* 공통 */
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.top .back{background:#fff;border:2px solid var(--ink);border-radius:4px;padding:5px 11px;font-size:14px;font-weight:700;white-space:nowrap}
.top b{flex:1;font-size:17px;font-weight:900;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.03em}
.top .stat{font-size:13px;color:var(--dim);white-space:nowrap;font-weight:700}
.top .stat em{font-style:normal;color:var(--ink);font-size:18px;font-weight:900}
.timer{height:12px;background:#fff;border:2px solid var(--ink);border-radius:3px;overflow:hidden;margin-bottom:10px;display:none}
.timer i{display:block;height:100%;background:var(--blue);width:100%;transition:width .2s linear}
.timer.low i{background:var(--pink)}
#prompt{font-weight:900;font-size:18px;margin:6px 2px 12px;letter-spacing:-.03em}
#prompt small{display:block;font-weight:500;font-size:13px;color:var(--dim);letter-spacing:0}
#prompt u{text-decoration:none;background:linear-gradient(transparent 55%,var(--yel) 55%)}
h2.sub{font-size:26px;font-weight:900;margin:14px 0 16px;letter-spacing:-.04em}

/* 카드 4장 */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{position:relative;background:#fff;border:2.5px solid var(--ink);border-radius:6px;padding:0;aspect-ratio:1/0.92;overflow:hidden;box-shadow:var(--sh);transition:transform .1s,box-shadow .1s,background .1s}
.card svg{width:100%;height:100%;display:block}
.card .tag{position:absolute;left:0;top:0;font-size:13px;font-weight:900;background:var(--ink);color:#fff;padding:1px 8px 2px;border-radius:0 0 5px 0}
.card.sel{background:#E8EDFF;transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink);border-color:var(--blue)}
.card.sel .tag{background:var(--blue)}
.card.good{background:#DDF7EC;border-color:var(--mint)} .card.good .tag{background:var(--mint)}
.card.bad{background:#FFE3EA;border-color:var(--pink)} .card.bad .tag{background:var(--pink)}

/* 겹친 그림 */
.figwrap{background:#fff;border:2.5px solid var(--ink);border-radius:6px;box-shadow:var(--sh);height:min(46vh,330px);min-height:230px}
.figwrap svg{width:100%;height:100%;display:block}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.opt{background:#fff;border:2.5px solid var(--ink);border-radius:6px;padding:11px 6px;font-size:21px;font-weight:700;font-family:"Times New Roman",serif;box-shadow:var(--sh);transition:transform .1s,box-shadow .1s}
.opt.sel{background:#E8EDFF;border-color:var(--blue);transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.opt.good{background:#DDF7EC;border-color:var(--mint)}
.opt.bad{background:#FFE3EA;border-color:var(--pink)}

/* 그림 속 글자 */
.lab{font-size:var(--fs,15px);font-weight:900;fill:var(--ink);paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
.alab{font-size:var(--fs,15px);font-weight:900;fill:var(--pink);paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
.vlab{font-family:"Times New Roman",serif;font-style:italic;font-size:calc(var(--fs,15px) + 4px);fill:var(--ink);paint-order:stroke;stroke:#fff;stroke-width:4px}

/* 아래 버튼 */
#actions{margin-top:16px}
.go{width:100%;border:2.5px solid var(--ink);border-radius:6px;background:var(--ink);color:#fff;font-size:18px;font-weight:900;padding:13px;box-shadow:4px 4px 0 var(--pink);transition:transform .08s,box-shadow .08s}
.go:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--pink)}
.go:disabled{opacity:.3;box-shadow:none}
.condq{font-weight:900;font-size:15px;margin:0 0 8px;letter-spacing:-.02em}
.conds{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.conds button{border:2.5px solid var(--ink);border-radius:6px;background:var(--yel);font-size:20px;font-weight:900;padding:12px 0;box-shadow:var(--sh);letter-spacing:-.02em}
.conds button:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.conds button:disabled{opacity:.3;box-shadow:none}

/* 피드백 시트 */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;transform:translateY(105%);transition:transform .25s ease-out}
#sheet.on{transform:none}
#sheet .in{max-width:560px;margin:0 auto;background:#fff;border:2.5px solid var(--ink);border-bottom:none;border-radius:10px 10px 0 0;box-shadow:0 -6px 0 rgba(23,23,28,.08);padding:16px 18px calc(16px + env(safe-area-inset-bottom));max-height:62vh;overflow:auto}
#sheet h3{margin:0 0 8px;font-size:22px;font-weight:900;letter-spacing:-.03em;display:inline-block;padding:0 8px;color:#fff}
#sheet h3.ok{background:var(--mint)} #sheet h3.ng{background:var(--pink)}
#sheet p{margin:6px 0;font-size:15.5px}
#sheet .ln{background:var(--soft);border-left:4px solid var(--ink);padding:8px 12px;margin:6px 0;font-size:15px}
#sheet .neq{color:var(--pink);font-weight:900}
#sheet .eq{color:var(--mint);font-weight:900}
#sheet .note{background:#FFF3C2;border:2px dashed var(--ink);border-radius:6px;padding:8px 12px;font-size:14.5px}
#sheet svg.split{width:100%;height:150px;display:block;background:var(--paper);border:2px solid var(--ink);border-radius:6px;margin:8px 0}
#sheet .go{margin-top:12px}
.m{font-family:"Times New Roman",serif;font-style:italic}

#toast{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) rotate(-3deg) scale(.7);opacity:0;z-index:30;padding:12px 24px;border:3px solid var(--ink);border-radius:6px;box-shadow:5px 5px 0 var(--ink);font-size:26px;font-weight:900;color:#fff;pointer-events:none;transition:all .16s;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,-50%) rotate(-3deg) scale(1)}

/* 입력·결과·랭킹 */
.box{background:#fff;border:2.5px solid var(--ink);border-radius:6px;padding:18px;box-shadow:var(--sh)}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-weight:900;font-size:14px;margin-bottom:4px}
.field input{width:100%;font:inherit;font-size:20px;padding:11px 14px;border:2.5px solid var(--ink);border-radius:4px;background:var(--paper);color:var(--ink)}
.err{color:var(--pink);font-weight:700;font-size:14px;min-height:20px;margin:0 0 6px}
.big{text-align:center;font-size:64px;font-weight:900;margin:4px 0 0;letter-spacing:-.04em}
.big{background:linear-gradient(transparent 58%,var(--yel) 58%);display:table;margin-left:auto;margin-right:auto;padding:0 8px}
.mid{text-align:center;color:var(--dim);margin:0 0 14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.ghost{background:#fff;border:2.5px solid var(--ink);border-radius:6px;padding:12px;font-weight:900;font-size:16px;box-shadow:var(--sh)}
table.rk{width:100%;border-collapse:collapse;font-size:15px}
table.rk th{color:var(--dim);font-weight:700;font-size:13px;text-align:left;padding:6px 4px;border-bottom:2.5px solid var(--ink)}
table.rk td{padding:8px 4px;border-bottom:1px solid #E4DCCB}
table.rk td.n{font-weight:900;width:2.2em}
.rkbar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.rkbar select{font:inherit;padding:6px 10px;border-radius:4px;border:2px solid var(--ink);background:#fff}
.rkbar .sp{flex:1}
.small{font-size:13px;color:var(--dim)}
@media (prefers-reduced-motion:reduce){#sheet,#toast,.timer i,.card,.opt,.mbtn{transition:none}}
.lead{color:var(--dim);margin:4px 2px 4px}
.mbtn .ic.big1,.mbtn .ic.big2{flex-direction:column;font-size:26px;line-height:1;min-width:60px;height:60px}
.mbtn .ic i{font-style:normal;font-size:11px;font-weight:800;margin-top:2px}
.mbtn .ic.big1{background:var(--yel)} .mbtn .ic.big2{background:var(--pink);color:#fff}
.mbtn.stage{padding:18px 16px}
.menu.tight{gap:10px}
.menu.tight .mbtn{padding:11px 14px}
.menu.tight .mbtn b{font-size:17px}
.stars{color:var(--pink);letter-spacing:1px;font-size:13px;font-weight:900}
.lv{display:inline-block;font-size:12px;font-weight:900;border:2px solid var(--ink);border-radius:3px;padding:0 5px;margin-left:4px;background:var(--yel)}
.seg{display:flex;border:2.5px solid var(--ink);border-radius:6px;overflow:hidden;margin-bottom:10px;box-shadow:var(--sh)}
.seg button{flex:1;border:none;background:#fff;padding:9px;font-weight:900}
.seg button.on{background:var(--ink);color:#fff}
.mini{font-size:13px;color:var(--dim);font-weight:700;text-align:center;margin:8px 0 0}
.clock{font-weight:900;font-size:18px;font-variant-numeric:tabular-nums;min-width:3.2em;text-align:right}
.clock.low{color:var(--pink)} .clock.over{color:var(--pink);font-size:15px}
.prog{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin:2px 0 8px}
.prog i{height:12px;border:2px solid var(--ink);border-radius:3px;background:#fff}
.prog i.on{background:var(--mint)} .prog i.cur{background:var(--yel)}
.badge{display:inline-block;font-size:12px;font-weight:900;border:2px solid var(--ink);border-radius:3px;padding:0 6px;margin-left:6px;background:var(--mint);color:#fff;vertical-align:2px;white-space:nowrap}
.btime{font-size:12px;color:var(--dim);font-weight:700}
.helper{border:2.5px solid var(--ink);border-radius:6px;background:var(--yel);padding:12px 14px;margin:14px 0;box-shadow:var(--sh);font-weight:800}
.helper small{display:block;font-weight:500}
.stamp{width:150px;height:150px;margin:6px auto 10px;border:6px solid var(--pink);border-radius:50%;display:grid;place-items:center;color:var(--pink);font-weight:900;font-size:34px;transform:rotate(-12deg);letter-spacing:-.02em;line-height:1;text-align:center}
.stamp small{display:block;font-size:13px;font-weight:800;margin-top:4px}
.stamp.gray{border-color:var(--dim);color:var(--dim)}
.doneTime{text-align:center;font-size:44px;font-weight:900;margin:0;font-variant-numeric:tabular-nums}
.cn{font-weight:700;color:var(--pink);font-size:14px;white-space:nowrap}
</style>
</head>
<body>
<div id="app">

  <!-- 첫 화면 -->
  <section id="home" class="scr on">
    <div class="hero">
      <svg viewBox="0 0 150 96" aria-hidden="true" style="mix-blend-mode:multiply">
        <polygon points="6,88 58,88 40,48" fill="#FF3E6C" opacity=".85"/>
        <polygon points="56,88 144,88 117,22" fill="#2F5BFF" opacity=".8"/>
        <polygon points="62,92 150,92 123,26" fill="none" stroke="#17171C" stroke-width="2.5" stroke-linejoin="round"/>
        <polygon points="2,92 54,92 36,52" fill="none" stroke="#17171C" stroke-width="2.5" stroke-linejoin="round"/>
      </svg>
      <h1>닮은 <span>삼각형</span></h1>
      <p>3분 안에 10문제를 맞혀 클리어해요</p>
    </div>
    <div class="menu">
      <button class="mbtn stage" data-stage="1"><span class="ic big1">1<i>단계</i></span><span><b>떨어진 삼각형</b><small id="hs1">네 삼각형 중 닮은 두 삼각형 찾기</small></span></button>
      <button class="mbtn stage" data-stage="2"><span class="ic big2">2<i>단계</i></span><span><b>겹쳐진 삼각형</b><small id="hs2">한 그림 속에서 닮은 삼각형 찾기</small></span></button>
    </div>
    <div id="helperHome"></div>
  </section>

  <!-- 유형 고르기 -->
  <section id="list" class="scr">
    <div class="top"><button class="back" data-go="home">처음으로</button><b id="listTitle"></b><span class="stat"></span></div>
    <p class="lead" id="listLead"></p>
    <div id="helperBox"></div>
    <div class="menu tight" id="typeList"></div>
  </section>

  <!-- 문제 화면 -->
  <section id="play" class="scr">
    <div class="top"><button class="back" id="quit">그만하기</button><b id="modeName"></b><span class="clock" id="clock">3:00</span></div>
    <div class="prog" id="prog"></div>
    <p id="prompt"></p>
    <div id="stageArea"></div>
    <div id="actions"></div>
  </section>

  <!-- 끝 -->
  <section id="done" class="scr">
    <div class="top"><button class="back" id="doneBack">목록으로</button><b id="doneTitle"></b><span class="stat"></span></div>
    <div class="box" id="doneBox"></div>
  </section>
</div>
<div id="sheet"><div class="in" id="sheetIn"></div></div>
<div id="toast"></div>
<script>
/* 닮은 삼각형 — 1단계 떨어진 삼각형 / 2단계 겹쳐진 삼각형 연습 (기록은 이 기기에만 저장) */
let useLS=true; try{localStorage.setItem('__t','1');localStorage.removeItem('__t');}catch(e){useLS=false;}
const mem={};
const LS={get(k,d){try{const v=useLS?localStorage.getItem(k):mem[k];return v==null?d:JSON.parse(v);}catch(e){return d;}},
          set(k,v){const s=JSON.stringify(v);if(useLS){try{localStorage.setItem(k,s);return;}catch(e){useLS=false;}}mem[k]=s;}};
/* ═════════════ 수학 도구 ═════════════ */
const RAD=Math.PI/180;
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const gcd=(a,b)=>b?gcd(b,a%b):a;
const P=(x,y)=>({x,y});
const sub=(a,b)=>P(a.x-b.x,a.y-b.y), add=(a,b)=>P(a.x+b.x,a.y+b.y), mul=(a,k)=>P(a.x*k,a.y*k);
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const lerp=(a,b,t)=>P(a.x+(b.x-a.x)*t,a.y+(b.y-a.y)*t);
function angAt(V,A,B){const u=sub(A,V),w=sub(B,V);return Math.acos(Math.max(-1,Math.min(1,(u.x*w.x+u.y*w.y)/(Math.hypot(u.x,u.y)*Math.hypot(w.x,w.y)))))/RAD;}
function ratio(a,b){const A=Math.round(a*10),B=Math.round(b*10),g=gcd(A,B);return `${A/g} : ${B/g}`;}
function rt(a,b){const r=ratio(a,b);return r===`${fmt(a)} : ${fmt(b)}`?r:`${fmt(a)} : ${fmt(b)} = ${r}`;}
const fmt=x=>String(Math.round(x*100)/100);
const sorted=a=>a.slice().sort((x,y)=>x-y);
const vset=s=>s.split('').sort().join('');
const TAGS=['가','나','다','라'];
const PERMS=[[0,1,2],[0,2,1],[1,0,2],[1,2,0],[2,0,1],[2,1,0]];

/* 꼭짓점 i의 맞은편 변 = s[i] */
function triSides(a,b,c){const x=(b*b+c*c-a*a)/(2*c);return [P(0,0),P(c,0),P(x,Math.sqrt(Math.max(0,b*b-x*x)))];}
/* 꼭짓점 0의 각 th, 꼭짓점 0에서 나가는 두 변 p(→꼭짓점1), q(→꼭짓점2) */
function triSAS(p,q,th){return [P(0,0),P(p,0),P(q*Math.cos(th*RAD),q*Math.sin(th*RAD))];}
function triAng(a0,a1,a2){return [P(0,0),P(Math.sin(a2*RAD),0),mul(P(Math.cos(a0*RAD),Math.sin(a0*RAD)),Math.sin(a1*RAD))];}
const randView=()=>({rot:Math.random()*Math.PI*2,flip:Math.random()<.5});
const flatView=()=>({rot:0,flip:false});

/* ═════════════ 1단계: 카드 ═════════════
   카드 = 실제 도형(pts) + 보이는 정보(sd: 변, an: 각; 모르면 null) + 정보 종류(t)
   t: S3 세 변 / S2 두 변 / SAS 두 변과 끼인각 / SSA 두 변과 끼인각이 아닌 각 / A2 두 각 / A1 한 각
   same: 정답 쌍과 실제로 같은 모양인지(정보 부족 함정 카드)                  */
function card(pts,sd,an,t,size,same){return {pts,sd,an,t,size,same:!!same};}
function closeAng(an){const k=an.filter(x=>x!=null).length;if(k===2){const s=an.reduce((a,b)=>a+(b||0),0);return an.map(x=>x==null?180-s:x);}return an;}
/* 두 카드에서 보이는 정보만으로 확인할 수 있는 닮음 조건 (모든 대응을 시험) */
function provable(X,Y){
  const ax=closeAng(X.an),ay=closeAng(Y.an),res=new Set(),eq=(a,b)=>Math.abs(a-b)<1e-6;
  for(const s of PERMS){
    let c=0;for(let i=0;i<3;i++)if(ax[i]!=null&&ay[s[i]]!=null&&eq(ax[i],ay[s[i]]))c++;
    if(c>=2)res.add('AA');
    if([0,1,2].every(i=>X.sd[i]!=null&&Y.sd[s[i]]!=null)){const r=X.sd[0]/Y.sd[s[0]];if([1,2].every(i=>eq(X.sd[i]/Y.sd[s[i]],r)))res.add('SSS');}
    for(let k=0;k<3;k++){if(ax[k]==null||ay[s[k]]==null||!eq(ax[k],ay[s[k]]))continue;
      const [i,j]=[0,1,2].filter(x=>x!==k);
      if(X.sd[i]!=null&&X.sd[j]!=null&&Y.sd[s[i]]!=null&&Y.sd[s[j]]!=null&&eq(X.sd[i]/Y.sd[s[i]],X.sd[j]/Y.sd[s[j]]))res.add('SAS');}
  }
  return res;
}
function finish(cards,type,lv){
  cards=shuffle(cards);
  const pairs=[];for(let i=0;i<4;i++)for(let j=i+1;j<4;j++){const p=provable(cards[i],cards[j]);if(p.size)pairs.push([i,j,[...p]]);}
  if(pairs.length!==1)return null;
  const sideV=[[1,2],[0,2],[0,1]];
  cards.forEach(c=>{c.v=lv===1?flatView():randView();c.sides=[];c.angs=[];

/* 10문제 난이도: 1~3 교과서 방향·다른 삼각형이 섞인 보기 / 4~6 좌우 뒤집기·살짝 회전 / 7~10 크게 회전 + 같은 삼각형의 순서만 바꾼 보기 */
function genOV(ti,n){
  const L=n<3?1:n<6?2:3;
  for(let t=0;t<300;t++){
    const f=OV_T[OV_ORDER[ti]]();f.pars=f.pars||[];
    if(!corrOK(f,f.base,f.correct))continue;
    const perm=f.others.length===0||L===3;
    const opts=[f.correct]; if(f.trap)opts.push(f.trap);
    if(!perm) for(const o of shuffle(f.others)) if(opts.length<4&&!opts.some(x=>vset(x)===vset(o)))opts.push(o);
    for(const p of shuffle(PERMS)){if(opts.length>=4)break;const o=p.map(i=>f.correct[i]).join('');if(!opts.includes(o))opts.push(o);}
    if(opts.length!==4||opts.filter(o=>corrOK(f,f.base,o)).length!==1)continue;
    f.opts=shuffle(opts);f.ans=f.opts.indexOf(f.correct);
    f.v=L===1?{flip:false,rot:0}:L===2?{flip:Math.random()<.5,rot:(Math.random()-.5)*0.5}:{flip:Math.random()<.5,rot:(Math.random()-.5)*1.6};
    return {kind:'ov',type:'OV',ti,lv:L,fig:f,conds:[f.cond]};

}

const NS='http://www.w3.org/2000/svg';
function S(tag,at,par,txt){const e=document.createElementNS(NS,tag);for(const k in at)e.setAttribute(k,at[k]);if(txt!=null)e.textContent=txt;if(par)par.appendChild(e);return e;}
function fsFor(W){return W<175?14:W<230?15:16;}
function arcPath(V,A,B,r){
  const a1=Math.atan2(A.y-V.y,A.x-V.x),a2=Math.atan2(B.y-V.y,B.x-V.x);

  return `M${V.x+r*Math.cos(a1)},${V.y+r*Math.sin(a1)} A${r},${r} 0 0 ${sw} ${V.x+r*Math.cos(a2)},${V.y+r*Math.sin(a2)}`;
}
function unit(v){const L=Math.hypot(v.x,v.y)||1;return P(v.x/L,v.y/L);}
function drawAngle(g,V,A,B,txt,FS,out){
  const la=Math.min(dist(V,A),dist(V,B)),deg=angAt(V,A,B);

  if(txt){const u=unit(add(unit(sub(A,V)),unit(sub(B,V))));

    if(out||deg>95){const rr=FS*1.25;return S('text',{x:V.x-u.x*rr,y:V.y-u.y*rr,'text-anchor':'middle','dominant-baseline':'central',class:'alab'},g,txt);}
    const rr=r+FS*(deg<50?1.25:0.95);
    return S('text',{x:V.x+u.x*rr,y:V.y+u.y*rr,'text-anchor':'middle','dominant-baseline':'central',class:'alab'},g,txt);}
}
function drawRight(g,V,A,B){const s=10,u=unit(sub(A,V)),w=unit(sub(B,V));
  S('path',{d:`M${V.x+u.x*s},${V.y+u.y*s} L${V.x+u.x*s+w.x*s},${V.y+u.y*s+w.y*s} L${V.x+w.x*s},${V.y+w.y*s}`,fill:'none',stroke:'#FF3E6C','stroke-width':2.2},g);}
function drawPar(g,A,B){ /* 평행 표시: 선분 가운데에 같은 방향 화살표 두 개 */
  const u=unit(sub(B,A)),n=P(-u.y,u.x),m=lerp(A,B,.5);
  [-4,4].forEach(o=>{const c=add(m,mul(u,o));
    S('path',{d:`M${c.x-u.x*6+n.x*6},${c.y-u.y*6+n.y*6} L${c.x},${c.y} L${c.x-u.x*6-n.x*6},${c.y-u.y*6-n.y*6}`,fill:'none',stroke:'#2F5BFF','stroke-width':2.6,'stroke-linecap':'round','stroke-linejoin':'round'},g);});

function sideLabel(g,A,B,away,txt,FS){

function toScreen(pts,v){const c=Math.cos(v.rot),s=Math.sin(v.rot);return pts.map(p=>{const x=v.flip?-p.x:p.x,y=p.y;return P(x*c-y*s,-(x*s+y*c));});}
function fit(pts,W,H,M,f){

  const k=Math.min((W-2*M)/(x1-x0||1),(H-2*M)/(y1-y0||1))*(f||1),cx=(x0+x1)/2,cy=(y0+y1)/2;
  return p=>P(W/2+(p.x-cx)*k,H/2+(p.y-cy)*k);

function renderCard(svg,c,sizeF){
  const r=svg.getBoundingClientRect(),W=r.width,H=r.height;if(!W)return;
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.innerHTML='';
  const FS=fsFor(W);svg.style.setProperty('--fs',FS+'px');
  const sp=toScreen(c.pts,c.v),tf=fit(sp,W,H,FS*1.9,sizeF),Q=sp.map(tf),g=S('g',{},svg);
  const ctr=P((Q[0].x+Q[1].x+Q[2].x)/3,(Q[0].y+Q[1].y+Q[2].y)/3);
  S('polygon',{points:Q.map(p=>p.x+','+p.y).join(' '),fill:'#FFE27A',stroke:'#17171C','stroke-width':2.5,'stroke-linejoin':'round'},g);
  const tx=c.angs.map(([v,t])=>{const o=[0,1,2].filter(x=>x!==v);return [v,o,t,drawAngle(g,Q[v],Q[o[0]],Q[o[1]],t,FS)];});
  c.sides.forEach(([i,j,t])=>sideLabel(g,Q[i],Q[j],ctr,String(t),FS));

  const boxOf=e=>{const b=e.getBBox();return b;},hit=(a,b)=>!(a.x+a.width<b.x||b.x+b.width<a.x||a.y+a.height<b.y||b.y+b.height<a.y);

  tx.forEach(([v,o,t,e],k)=>{if(!e)return;const others=all.filter(x=>x!==e);
    if(others.some(x=>hit(boxOf(e),boxOf(x)))){
      g.removeChild(e);const ne=drawAngle(g,Q[v],Q[o[0]],Q[o[1]],null,FS);/* 호는 이미 있음: 글자만 바깥에 */
      if(ne)g.removeChild(ne);
      const u=unit(add(unit(sub(Q[o[0]],Q[v])),unit(sub(Q[o[1]],Q[v])))),rr=FS*1.25;
      S('text',{x:Q[v].x-u.x*rr,y:Q[v].y-u.y*rr,'text-anchor':'middle','dominant-baseline':'central',class:'alab'},g,t);

function figScreen(f){const names=Object.keys(f.pts),sp=toScreen(names.map(n=>f.pts[n]),f.v),o={};names.forEach((n,i)=>o[n]=sp[i]);return o;}
function renderFig(svg,f,hi,hiCls){
  const r=svg.getBoundingClientRect(),W=r.width,H=r.height;if(!W)return;
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.innerHTML='';
  const FS=W<330?15:16;svg.style.setProperty('--fs',FS+'px');
  const sc=figScreen(f),tf=fit(Object.values(sc),W,H,FS*2.2),Q={};for(const n in sc)Q[n]=tf(sc[n]);
  const g=S('g',{},svg);
  if(hi){S('polygon',{points:hi.split('').map(n=>Q[n].x+','+Q[n].y).join(' '),fill:hiCls==='bad'?'rgba(255,62,108,.22)':hiCls==='good'?'rgba(0,179,126,.28)':'rgba(47,91,255,.22)',stroke:'none'},g);}
  f.segs.forEach(([a,b])=>S('line',{x1:Q[a].x,y1:Q[a].y,x2:Q[b].x,y2:Q[b].y,stroke:'#17171C','stroke-width':2.6,'stroke-linecap':'round'},g));
  f.rights.forEach(([v,a,b])=>drawRight(g,Q[v],Q[a],Q[b]));

}
/* 떼어 보기: 기준 삼각형과 정답 삼각형을 같은 방향으로 나란히 */
function renderSplit(svg,f){
  const r=svg.getBoundingClientRect(),W=r.width,H=r.height;if(!W)return;
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.innerHTML='';svg.style.setProperty('--fs','15px');

function tapCard(i){if(st.locked)return;const k=st.sel.indexOf(i);

function judge(){
  if(st.locked||!canSubmit())return;st.locked=true;
  const pb=st.pb,picked=st.sel.slice();let ok;
  if(pb.kind==='sep'){const s=picked.slice().sort();ok=s[0]===pb.pair[0]&&s[1]===pb.pair[1];
    document.querySelectorAll('#stageArea .card').forEach(b=>{const i=+b.dataset.i;b.classList.remove('sel');
      if(pb.pair.includes(i))b.classList.add('good');else if(picked.includes(i))b.classList.add('bad');});}
  else{ok=picked[0]===pb.fig.ans;st.wrongOpt=pb.fig.opts[picked[0]];
    document.querySelectorAll('#stageArea .opt').forEach(b=>{const i=+b.dataset.i;b.classList.remove('sel');
      if(i===pb.fig.ans)b.classList.add('good');else if(picked.includes(i))b.classList.add('bad');});
    st.sel=[pb.fig.ans];st.hiCls='good';draw();}
  $('ok').disabled=true;
  if(ok){
    st.n++;renderProg();
    toast(`정답! ${pb.conds.join('·')} 닮음`,true);
    if(st.n>=GOAL)setTimeout(finishRun,700);else setTimeout(next,850);
  }else{st.wrong++;feedback(picked);}
}
function feedback(picked){
  const pb=st.pb;let h='';
  const condName=pb.conds.join(' 또는 ')+' 닮음';
  if(pb.kind==='sep'){
    const [a,b]=pb.pair,tg=`(${TAGS[a]})와 (${TAGS[b]})`,[x,y]=picked.slice().sort();
    h+=`<h3 class="ng">아쉬워요</h3><p>고른 (${TAGS[x]})와 (${TAGS[y]})</p>`+explainPair(pb,x,y);
    const tricks=[x,y].filter(i=>pb.cards[i].same&&!pb.pair.includes(i));
    if(tricks.length)h+=`<p class="note">💡 (${tricks.map(i=>TAGS[i]).join('), (')})는 사실 정답과 <b>같은 모양</b>이에요. 하지만 주어진 정보로는 닮음 조건을 확인할 수 없어서 "닮음이라고 말할 수" 없어요.</p>`;
    h+=`<p>정답은 <b>${tg}</b>, ${condName}이에요.</p>`+explainPair(pb,a,b);
  }else{
    const f=pb.fig,w=st.wrongOpt,same=vset(w)===vset(f.correct);
    h+=`<h3 class="ng">아쉬워요</h3><p>△${w}${same?'는 삼각형은 맞지만 <b>꼭짓점의 대응 순서</b>가 달라요.':'는 △'+f.base+'와 닮은 삼각형이 아니에요.'}</p>`;
    h+=`<div class="ln">${f.why}<br>→ △${f.base} ∽ △${f.correct} <b>(${f.cond} 닮음)</b></div>`;
    h+=`<p class="small" style="margin-bottom:0">두 삼각형을 떼어서 같은 방향으로 놓으면</p><svg class="split"></svg>`;
    h+=`<p class="small" style="margin-top:0">같은 색 점끼리 대응해요: ${f.base.split('').map((n,i)=>`${n}↔${f.correct[i]}`).join(', ')}</p>`;
  }
  h+=`<p class="small">틀린 문제는 같은 난이도의 새 문제로 다시 나와요. 시간은 계속 흘러요!</p><button class="go" id="nextBtn">다음 문제</button>`;
  $('sheetIn').innerHTML=h;$('sheet').classList.add('on');
  $('nextBtn').onclick=next;
  $('app').style.paddingBottom=Math.min(innerHeight*.62,$('sheetIn').offsetHeight+20)+'px';
  requestAnimationFrame(draw);
}
function finishRun(){
  stopTimer();const t=elapsed(),ok=t<=LIMIT_SEC,key=`${st.stage}-${st.type}`;
  const C=clears(),wasAll=allClear(st.stage);
  if(ok){C[key]={best:Math.min(t,C[key]?C[key].best:Infinity),at:Date.now()};LS.set(CK,C);}
  const nowAll=allClear(st.stage);
  $('doneTitle').textContent=`${st.stage}단계 · ${typeName(st.stage,st.type)}`;
  $('doneBox').innerHTML=(ok?`<div class="stamp">CLEAR<small>${new Date().toLocaleDateString('ko-KR')}</small></div>`:`<div class="stamp gray">완주<small>시간 초과</small></div>`)+
    `<p class="doneTime">${fmtT(t)}</p><p class="mid">10문제 정답 · 틀린 횟수 ${st.wrong}번</p>`+
    (ok?'':`<p class="mid">3분 안에 10문제를 맞히면 클리어예요. 다시 도전해 봐요!</p>`)+
    (nowAll&&!wasAll?`<div class="helper">🏅 ${st.stage}단계 도우미가 되었어요!<small>${st.stage===1?'세 가지':'모든'} 유형을 클리어했어요. 선생님께 화면을 보여 드리고 친구들을 도와주세요.</small></div>`:'')+
    `<div class="row2"><button class="ghost" id="dList">목록으로</button><button class="go" id="dAgain" style="padding:13px">다시 도전</button></div>`;
  $('dList').onclick=()=>openList(st.stage);$('dAgain').onclick=()=>start(st.type);
  show('done');
}
function closeSheet(){$('sheet').classList.remove('on');$('app').style.paddingBottom='';}
let toT=null;function toast(m,ok){const t=$('toast');t.textContent=m;t.style.background=ok?'var(--o)':'var(--x)';t.classList.add('on');clearTimeout(toT);toT=setTimeout(()=>t.classList.remove('on'),650);}
renderHome();
</script>
</body>
